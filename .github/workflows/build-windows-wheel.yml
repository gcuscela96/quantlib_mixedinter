name: Build Windows QuantLib wheel (frontier fork)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout this repo (contains the two .patch files)
        uses: actions/checkout@v4
        with:
          path: patches-repo

      - name: Checkout QuantLib
        uses: actions/checkout@v4
        with:
          repository: lballabio/QuantLib
          path: QuantLib

      - name: Apply QuantLib patch
        working-directory: QuantLib
        run: git apply ..\patches-repo\QuantLib.patch

      - name: Checkout QuantLib-SWIG
        uses: actions/checkout@v4
        with:
          repository: lballabio/QuantLib-SWIG
          path: QuantLib-SWIG

      - name: Apply QuantLib-SWIG patch
        working-directory: QuantLib-SWIG
        run: git apply ..\patches-repo\QuantLib-SWIG.patch

      - name: Install SWIG (via Chocolatey)
        run: choco install swig -y --no-progress

      - name: Setup Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9.9"

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Download Boost, extract, and build QuantLib.lib
        working-directory: QuantLib
        shell: pwsh
        run: |
          $ver = "1.84.0"
          $verUnderscore = $ver -replace '\.', '_'
          $boostRoot = "C:\boost\boost_$verUnderscore"
          $url = "https://archives.boost.org/release/$ver/source/boost_$verUnderscore.zip"

          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\boost.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\boost.zip" -DestinationPath "C:\boost"

          if (-not (Test-Path "$boostRoot\boost\config.hpp")) {
            throw "boost/config.hpp not found under $boostRoot -- archive layout unexpected"
          }
          Write-Host "Boost headers OK at $boostRoot"

          $env:INCLUDE = "$env:INCLUDE;$boostRoot"
          Write-Host "INCLUDE is now: $env:INCLUDE"

          # MSBuild's C++ build tasks do NOT reliably fall back to the
          # process INCLUDE environment variable when compiling through a
          # .vcxproj -- they build the include list mostly from project
          # properties. So we also inject the Boost path directly via a
          # Directory.Build.props file, which MSBuild auto-imports from
          # the project's own directory and which QuantLib.vcxproj's
          # "%(AdditionalIncludeDirectories)" metadata correctly inherits.
          # (built as a single-line join instead of a here-string, so this
          # stays a plain, consistently indented YAML block scalar)
          $propsLines = @(
            "<Project>",
            "  <ItemDefinitionGroup>",
            "    <ClCompile>",
            "      <AdditionalIncludeDirectories>$boostRoot;%(AdditionalIncludeDirectories)</AdditionalIncludeDirectories>",
            "    </ClCompile>",
            "  </ItemDefinitionGroup>",
            "</Project>"
          )
          $propsLines -join "`n" | Out-File -FilePath "Directory.Build.props" -Encoding utf8

          Write-Host "Directory.Build.props written:"
          Get-Content "Directory.Build.props"

          & msbuild QuantLib.sln /p:Configuration=Release /p:Platform=x64 /m
          if ($LASTEXITCODE -ne 0) { throw "msbuild failed with exit code $LASTEXITCODE" }

          # save the boost root for the next step (same job, so GITHUB_ENV works
          # fine here -- this step itself is proof the value round-trips)
          echo "BOOST_ROOT=$boostRoot" >> $env:GITHUB_ENV

      - name: Build Python wheel
        working-directory: QuantLib-SWIG\Python
        shell: pwsh
        run: |
          $env:QL_DIR = "$env:GITHUB_WORKSPACE\QuantLib"
          $env:INCLUDE = "$env:INCLUDE;$env:BOOST_ROOT"
          Write-Host "QL_DIR is: $env:QL_DIR"
          Write-Host "INCLUDE is now: $env:INCLUDE"

          & swig.cmd
          if ($LASTEXITCODE -ne 0) { throw "swig failed with exit code $LASTEXITCODE" }

          python -m pip install build
          python -m build --wheel

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: quantlib-frontier-windows-wheel
          path: QuantLib-SWIG/Python/dist/*.whl
